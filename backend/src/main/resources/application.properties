# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.sql.init.mode=always


# Jackson
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.serialization.write-dates-as-timestamps=false

# AWS SQS
spring.cloud.aws.region.static=${AWS_REGION:us-east-1}
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY:test}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_KEY:test}
spring.cloud.aws.sqs.enabled=false

# Queue names
app.sqs.queue.ruta-cerrada=${QUEUE_RUTA_CERRADA:ruta-cerrada-queue}

# Jws
app.jwt.secret=${JWT_SECRET:12345678901234567890123456789012}

# Configuración de CORS
app.cors.allowed-origins=http://localhost:5173

# Logging
logging.level.com.logistica=INFO

#Mock tarifas de contratos
app.mock.tarifa.por-parada=15000
app.mock.tarifa.recorrido-completo=80000

